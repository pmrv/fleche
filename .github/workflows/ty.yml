name: ty

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -e .[tests]
      - name: Run ty
        run: pipx run ty check --exclude tests --ignore all
