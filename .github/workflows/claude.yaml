name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude-response:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    steps:
      - uses: actions/checkout@v6
      - name: Resolve model from mention
        id: model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          # The action does its own trigger detection: it only fires on '@claude'
          # followed by whitespace, punctuation, or end-of-line, so a model is
          # selected with a space -- '@claude [haiku|sonnet|opus]'. This step only
          # maps that alias onto a --model arg; bare or unrecognised mentions fall
          # back to sonnet. (A glued '@claude[model]' would not trigger the action.)
          body="${COMMENT_BODY}${REVIEW_BODY}"
          model=sonnet
          if [[ "$body" =~ @claude[[:space:]]*\[([a-zA-Z]+)\] ]]; then
            choice="${BASH_REMATCH[1],,}"
            case "$choice" in
              haiku|sonnet|opus)
                model="$choice"
                ;;
              *)
                echo "::warning::Unknown @claude model alias '$choice'; using default ($model)."
                ;;
            esac
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Selected model: $model"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model ${{ steps.model.outputs.model }} --effort high --allowedTools WebFetch Bash(pip:*) Bash(python:*) Bash(pytest:*) Bash(git:*) Bash(gh pr:*)'
          additional_permissions: |
            actions: read
