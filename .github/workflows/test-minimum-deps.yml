name: test-minimum-deps

on:
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/test-minimum-deps.yml'
              - '.github/actions/**'

  test-minimum-deps:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice
        if: needs.changes.outputs.run != 'true'
        run: echo "No source, test, or workflow changes; skipping."
      - uses: actions/checkout@v5
        if: needs.changes.outputs.run == 'true'
        with:
          # setuptools-scm derives the version from git history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        if: needs.changes.outputs.run == 'true'
      # Pin the interpreter to the oldest Python allowed by requires-python
      # (keep in sync with pyproject.toml). Without it, uv picks the runner's
      # system Python, which drifts with the image (ubuntu-26.04 ships 3.14),
      # and the floors may have no wheels there, so they get built from source.
      # uv downloads a managed 3.11 if the image lacks one.
      - run: uv venv --python 3.11
        if: needs.changes.outputs.run == 'true'
      # --resolution lowest-direct pins every direct dependency to the lowest
      # version its bound allows, exercising the floors declared in pyproject.
      - uses: ./.github/actions/install-fleche
        if: needs.changes.outputs.run == 'true'
        with:
          installer: uv pip
          args: --resolution lowest-direct
      - run: uv run --no-sync pytest
        if: needs.changes.outputs.run == 'true'
