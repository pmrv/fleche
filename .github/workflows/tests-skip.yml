name: Tests

on:
  pull_request:
    paths-ignore:
      - 'src/**'
      - 'tests/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "No src/ or tests/ changes; reporting success to satisfy required status check."
