[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fleche_ase"]

[project]
name = "fleche-ase"
# Bumped by release-please (release-type "python"); see release-please-config.json.
version = "1.0.0"
description = "ASE digest hooks for fleche"
authors = [
    { name="Marvin Poul", email="pmrv@posteo.de" },
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
dependencies = [
    'ase >= 3.28, < 4',
    'fleche >= 0.24.0.dev0',
    'fleche-numpy >= 1.0.0',
]

[project.urls]
Homepage = "https://github.com/pmrv/fleche"
Documentation = "https://fleche.readthedocs.io/"

[project.entry-points.'fleche']
digest = 'fleche_ase:digest_hooks'
destructure = 'fleche_ase:destructurers'
