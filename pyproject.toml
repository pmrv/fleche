[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fleche"]
package-dir = {""  = "src"}

[tool.setuptools_scm]
version_file = "src/fleche/_version.py"
fallback_version = "0.0.0"
# Development checkouts version as the next minor release (0.24.0.devN, not
# 0.23.2.devN), so the sister packages can require an unreleased fleche as
# `fleche >= 0.24.0.dev0`.
version_scheme = "release-branch-semver"

[tool.setuptools_scm.scm.git]
# fleche's own tags are bare versions (0.23.1); the sister packages under src/
# tag as fleche-numpy-1.0.0 etc., which setuptools-scm would otherwise parse as
# a fleche version whenever one is the nearest tag.
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "[0-9]*"]

[tool.pytest.ini_options]
markers = [
    "smoke: minimal, fast tests touching each optional dependency end-to-end (run with `pytest -m smoke`) — intended as a pre-release sanity check of the packaged distribution.",
]

[project]
name = "fleche"
dynamic = ["version"]
description = "Hierachical, persistant caches in python"
authors = [
    { name="Marvin Poul", email="pmrv@posteo.de" },
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
dependencies = [
    'pyiron-snippets >= 1.1',
    'filelock >= 3.4',
]

[project.optional-dependencies]
# Digest hooks for third-party types, released from src/ in this repository.
numpy = [
    "fleche-numpy",
]
pandas = [
    "fleche-pandas",
]
ase = [
    "fleche-ase",
]
docs = [
    "sphinx",
    "shibuya",
    "sphinx-autoapi",
    "nbsphinx",
    "ipython_pygments_lexers",
]
cloudpickle = [
    "cloudpickle >= 2",
]
dill = [
    "dill >= 0.3",
]
sqlalchemy = [
    "sqlalchemy >= 2",
]
bagofholding = [
    "bagofholding >=0.1.12,<0.1.17",
]
ssh = [
    # SshCache uses cloudpickle for its wire protocol — required, not optional.
    "cloudpickle >= 2",
]
tests = [
    "pytest >= 7.4",
    # The suite digests arrays and frames throughout; CI installs the sister
    # packages too (src/fleche-numpy, src/fleche-pandas), which need these.
    "numpy >= 1.26",
    "pandas >= 2.2, <4",
    "hypothesis >= 6.100",
    "cloudpickle >= 2",
    "dill >= 0.3",
    "sqlalchemy >= 2",
    "bagofholding >=0.1.12,<0.1.17",
    "nbconvert >= 6.5",
    "ipykernel >= 6.26",
    "tabulate >= 0.8",
    "attrs >= 21.3",
]
executorlib = [
    "executorlib",
]
ty = [
    "ty == 0.0.95",
]

[tool.ty.environment]
# The sister packages under src/ are first-party code too; ty does not follow
# setuptools' editable-install finders to them.
root = ["src", "src/fleche-numpy", "src/fleche-pandas", "src/fleche-ase"]
