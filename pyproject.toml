[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fleche"]
package-dir = {""  = "src"}

[tool.setuptools_scm]
version_file = "src/fleche/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
markers = [
    "smoke: minimal, fast tests touching each optional dependency end-to-end (run with `pytest -m smoke`) — intended as a pre-release sanity check of the packaged distribution.",
]

[project]
name = "fleche"
dynamic = ["version"]
description = "Hierachical, persistant caches in python"
authors = [
    { name="Marvin Poul", email="pmrv@posteo.de" },
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
dependencies = [
    'numpy >= 1.26',
    'pandas >= 2.2, <4',
    'pyiron-snippets >= 1.1',
    'filelock >= 3.4',
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autoapi",
    "nbsphinx",
    "ipython_pygments_lexers",
]
cloudpickle = [
    "cloudpickle >= 2",
]
dill = [
    "dill >= 0.3",
]
sqlalchemy = [
    "sqlalchemy >= 2",
]
bagofholding = [
    "bagofholding == 0.1.12",
]
ssh = [
    # SshCache uses cloudpickle for its wire protocol — required, not optional.
    "cloudpickle >= 2",
]
tests = [
    "pytest >= 7.4",
    "hypothesis >= 6.100",
    "cloudpickle >= 2",
    "dill >= 0.3",
    "sqlalchemy >= 2",
    "bagofholding == 0.1.12",
    "nbconvert >= 6.5",
    "ipykernel >= 6.26",
    "tabulate >= 0.8",
    "attrs >= 21.3",
]
executorlib = [
    "executorlib",
]
ty = [
    "ty == 0.0.59",
]
